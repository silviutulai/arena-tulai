<!doctype html><html lang="ro"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Arena Tulai Control</title><style>
body{font-family:Inter,system-ui,sans-serif;background:#0a0b12;color:#fff;margin:0;padding:24px}main{max-width:980px;margin:auto}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.card{background:#141625;border:1px solid #ffffff18;padding:18px;border-radius:16px}button,input,select{font:inherit;border-radius:10px;border:1px solid #ffffff22;padding:11px;background:#202338;color:#fff}button{cursor:pointer;font-weight:800}.primary{background:#743cff}.danger{background:#9c2943}.row{display:flex;gap:8px;flex-wrap:wrap}iframe{width:270px;height:480px;border:1px solid #ffffff25;border-radius:18px;background:#000}pre{white-space:pre-wrap;color:#b8c1e7}.wide{grid-column:1/-1}@media(max-width:760px){.grid{grid-template-columns:1fr}.wide{grid-column:auto}}</style></head><body><main><h1>🎮 Arena Tulai — Control Room</h1><p>Cheia admin se ia automat din <code>?key=...</code>. Ține pagina asta doar pentru tine.</p><div class="grid">
<div class="card"><h2>Rundă</h2><div class="row"><button class="primary" id="start">▶ Start / Next</button><button id="reveal">✅ Reveal</button><button class="danger" id="reset">♻ Reset joc</button></div><p id="state">—</p></div>
<div class="card"><h2>Preview 9:16</h2><iframe src="/"></iframe></div>
<div class="card"><h2>Demo răspuns</h2><div class="row"><input id="user" value="TulaiFan"><select id="answer"><option>A</option><option>B</option><option>C</option><option>D</option></select><button id="sendAnswer">Trimite</button></div></div>
<div class="card"><h2>Demo gift</h2><div class="row"><input id="giftUser" value="SuperFan"><input id="diamonds" type="number" value="50" min="1"><input id="giftName" value="Rose"><button id="sendGift">Gift</button></div></div>
<div class="card wide"><h2>Leaderboard</h2><pre id="leaderboard">—</pre></div>
</div></main><script src="/socket.io/socket.io.js"></script><script>
const key=new URLSearchParams(location.search).get('key')||''; const socket=io({auth:{key}}); let s=null;
socket.on('state',x=>{s=x;document.querySelector('#state').textContent=`Fază: ${x.phase} | Runda: ${x.roundNumber} | TikTok: ${x.tiktokStatus}`;document.querySelector('#leaderboard').textContent=x.leaderboard.map(p=>`#${p.rank} ${p.nickname} — ${p.score} pts (quiz ${p.knowledge} / gift ${p.gifts})`).join('\n')||'Niciun jucător încă.'});
const send=(ev,data={})=>socket.emit(ev,{key,...data});
document.querySelector('#start').onclick=()=>send('admin:start');document.querySelector('#reveal').onclick=()=>send('admin:reveal');document.querySelector('#reset').onclick=()=>confirm('Resetezi scorurile?')&&send('admin:reset');
document.querySelector('#sendAnswer').onclick=()=>send('admin:demoAnswer',{username:document.querySelector('#user').value,answer:document.querySelector('#answer').value});
document.querySelector('#sendGift').onclick=()=>send('admin:demoGift',{username:document.querySelector('#giftUser').value,diamonds:+document.querySelector('#diamonds').value,giftName:document.querySelector('#giftName').value});
</script></body></html>
