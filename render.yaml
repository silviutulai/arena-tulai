services:
  - type: web
    name: arena-tulai
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: TIKTOK_USERNAME
        sync: false
      - key: ADMIN_KEY
        generateValue: true
      - key: AUTO_ADVANCE
        value: "true"
