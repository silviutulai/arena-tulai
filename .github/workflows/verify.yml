name: Verify Arena Tulai
on:
  push:
    branches: [main, arena-visual-v2-20260926]
  pull_request:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Verify quiz, images, chat, gifts and LIKE goals
        run: npm run verify
